<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}</style>
<title>Aldéris</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap">
<style>
/* Concept : un sanctuaire nocturne. Barre latérale fixe à gauche, ciel étoilé vivant derrière un contenu centré, wiki lu comme un atlas. */
:root{
  --bg:#050813; --bg-side:#090f1c; --panel:#0c1424; --panel-2:#101b30; --field:#070d19; --line:#1b2943;
  --text:#e9eef7; --muted:#8c98ae; --faint:#5d6a82;
  --accent:#86cdf5;
  --accent-soft:color-mix(in srgb,var(--accent) 14%,var(--bg));
  --accent-line:color-mix(in srgb,var(--accent) 38%,var(--bg));
  --danger:#f19a9a;
  --f-display:'Cinzel Decorative','Cinzel',Georgia,serif;
  --f-head:'Cinzel',Georgia,serif;
  --f-prose:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --f-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sbw:256px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:15px/1.6 var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.ic{flex:none}

#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:100vh}
.main{min-width:0}
.page{max-width:1080px;margin:0 auto;padding-block:36px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Barre latérale */
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;background:var(--bg-side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px);z-index:20}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:22px 16px 18px}
.brand{font-family:var(--f-head);font-weight:600;font-size:18px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);text-shadow:0 0 18px color-mix(in srgb,var(--accent) 45%,transparent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.icon-btn{display:grid;place-items:center;width:32px;height:32px;flex:none;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--muted)}
.icon-btn:hover{color:var(--text);border-color:var(--accent-line)}
.icon-btn .ic{transition:transform .2s}
nav.menu{display:flex;flex-direction:column;gap:4px;padding:8px;flex:1;min-height:0;overflow-y:auto}
.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;border-radius:8px;border:1px solid transparent;background:none;color:#dbe3f1;font-weight:500;font-size:15px}
.nav:hover{background:color-mix(in srgb,var(--panel-2) 70%,transparent)}
.nav[aria-current=page]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.side-foot{padding:18px 16px;border-top:1px solid var(--line);text-align:center;font-family:var(--f-head);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.sub{display:flex;flex-direction:column;gap:2px;margin:2px 0 8px 29px;padding-left:12px;border-left:1px solid var(--line)}
.sub-item{display:block;width:100%;text-align:left;padding:7px 12px;border:1px solid transparent;border-radius:6px;background:none;color:var(--muted);font-size:13.5px;font-weight:500}
.sub-item:hover{color:var(--text);background:color-mix(in srgb,var(--panel-2) 70%,transparent)}
.sub-item[aria-current]{color:var(--accent);background:var(--accent-soft)}
.topbar,.scrim{display:none}

@media (min-width:821px){
  .app.collapsed{--sbw:68px}
  .app.collapsed .brand,.app.collapsed .lbl,.app.collapsed .side-foot,.app.collapsed .sub{display:none}
  .app.collapsed .side-top{justify-content:center;padding-inline:0}
  .app.collapsed .nav{justify-content:center;padding-inline:0}
  .app.collapsed .icon-btn .ic{transform:rotate(180deg)}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:280px;max-width:86vw;transform:translateX(-102%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(3,5,12,.66);z-index:15}
  .side-top .icon-btn{display:none}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg-side) 94%,transparent);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .page{padding-block:24px 72px}
}

/* Accueil */
.hero{display:grid;justify-items:center;text-align:center;padding-top:clamp(8px,3vw,32px)}
.orbit{position:relative;width:min(580px,100%);aspect-ratio:1/1;max-width:100%;display:grid;place-items:center}
.orbit::before{content:'';position:absolute;inset:14%;border-radius:50%;background:radial-gradient(closest-side,rgba(120,150,255,.14),transparent)}
.orbit i{position:absolute;border-radius:50%}
.orbit i:nth-of-type(1){inset:0;border:1px dashed color-mix(in srgb,var(--accent) 30%,transparent);animation:spin 260s linear infinite}
.orbit i:nth-of-type(2){inset:9%;border:1px solid color-mix(in srgb,var(--accent) 34%,transparent)}
.orbit i:nth-of-type(3){inset:20%;border:1px dashed color-mix(in srgb,var(--accent) 24%,transparent);animation:spin 190s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit-in{position:relative;display:grid;justify-items:center;gap:14px;width:72%}
.hero h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(2.4rem,9vw,5.2rem);line-height:1;letter-spacing:.03em;text-transform:uppercase;color:#fff;text-shadow:0 0 28px rgba(160,200,255,.45);text-wrap:balance;overflow-wrap:anywhere}
.tagline{margin:0;font-family:var(--f-prose);font-size:clamp(1.05rem,2.6vw,1.3rem);line-height:1.55;color:#a3aec3}
.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:20px}
.hint{display:grid;justify-items:center;margin-top:34px;background:none;border:0;color:var(--faint);padding:4px}
.hint .line{display:block;width:1px;height:34px;background:linear-gradient(var(--accent),transparent);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
html.still *{animation:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.sec{margin-top:72px}
.h-sec{margin:0 0 28px;text-align:center;font-family:var(--f-head);font-weight:500;font-size:clamp(1.6rem,4.2vw,2.4rem);letter-spacing:.04em;text-transform:uppercase;color:var(--accent);text-shadow:0 0 22px color-mix(in srgb,var(--accent) 40%,transparent);text-wrap:balance}
.center{display:flex;justify-content:center;margin-top:28px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:8px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);color:var(--text);font-weight:600;font-size:14px;text-decoration:none;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent-line)}
.btn.primary{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 22%,var(--bg))}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 38%,var(--bg))}
.btn.sm{padding:7px 12px;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:500;text-decoration:underline;text-decoration-color:var(--accent-line);text-underline-offset:3px;display:inline-flex;align-items:center;gap:6px}

/* Cartes et grilles */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{display:flex;flex-direction:column;gap:8px;min-width:0;padding:20px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 86%,transparent);text-decoration:none;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent-line);transform:translateY(-2px)}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.card h3{margin:0;font-family:var(--f-head);font-weight:600;font-size:1.08rem;letter-spacing:.03em;color:#f1f5fc;text-wrap:balance}
.card p{margin:0;font-family:var(--f-prose);font-size:1.12rem;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12px;color:var(--faint)}

.empty{display:grid;justify-items:center;gap:14px;padding:40px 20px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted);background:color-mix(in srgb,var(--panel) 60%,transparent)}
.empty p{margin:0;font-family:var(--f-prose);font-size:1.2rem}
.note{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:0 0 20px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--panel) 80%,transparent);color:var(--muted);font-size:13px}

/* En-têtes de page */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
.ph>div:first-child{min-width:0;flex:1 1 320px}
.eyebrow{margin:0 0 6px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
.ph h1{margin:0;font-family:var(--f-head);font-weight:600;font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:.03em;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.lede{margin:10px 0 0;font-family:var(--f-prose);font-style:italic;font-size:1.3rem;color:#a3aec3;max-width:60ch}
.ph-actions{display:flex;gap:10px;flex-wrap:wrap}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:22px;font-size:13px;color:var(--muted)}

/* Wiki : recherche et filtres */
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.search{position:relative;flex:1 1 240px;min-width:0}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search .in{padding-left:38px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 80%,transparent);color:var(--muted);font-size:13px;font-weight:500}
.pill:hover{color:var(--text);border-color:var(--accent-line)}
.pill[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.filters{margin-bottom:24px}

/* Chroniques */
.rows{display:grid;gap:14px}
.row{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px;padding:20px 22px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 86%,transparent);text-decoration:none;transition:border-color .15s}
.row:hover{border-color:var(--accent-line)}
.row .when{font-family:var(--f-head);font-size:13px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.row .when small{display:block;margin-top:6px;font-family:var(--f-ui);font-size:12px;letter-spacing:.08em;color:var(--faint)}
.row h3{margin:0 0 6px;font-family:var(--f-head);font-weight:600;font-size:1.25rem;letter-spacing:.03em}
.row p{margin:0;font-family:var(--f-prose);font-size:1.18rem;line-height:1.45;color:var(--muted)}
@media (max-width:640px){.row{grid-template-columns:minmax(0,1fr);gap:8px}}

/* Entrée / chronique : lecture */
.entry-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start}
.prose{font-family:var(--f-prose);font-size:1.28rem;line-height:1.7;color:#d6deec;max-width:62ch;min-width:0;overflow-wrap:anywhere}
.prose p{margin:0 0 1em}
.prose h3{margin:1.8em 0 .5em;font-family:var(--f-head);font-weight:600;font-size:1.02rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.prose ul{margin:0 0 1em;padding-left:1.2em}
.prose li{margin-bottom:.25em}
.xref{color:var(--accent);text-decoration:underline;text-decoration-color:var(--accent-line);text-underline-offset:3px}
.xref:hover{text-decoration-color:var(--accent)}
.xref.missing{color:var(--muted);text-decoration-style:dotted;cursor:help}
.infobox{position:sticky;top:24px;min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--panel) 90%,transparent)}
.ib-head{display:grid;gap:2px;padding:14px 16px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.ib-head span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.ib-head strong{font-family:var(--f-head);font-size:1.1rem;font-weight:600;letter-spacing:.03em;overflow-wrap:anywhere}
.infobox dl{display:grid;grid-template-columns:minmax(70px,34%) minmax(0,1fr);gap:10px 14px;margin:0;padding:16px}
.infobox dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.infobox dd{margin:0;font-family:var(--f-prose);font-size:1.08rem;line-height:1.35;overflow-wrap:anywhere}
.refs{margin-top:48px}
.refs h2{margin:0 0 14px;font-family:var(--f-head);font-weight:600;font-size:1rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;flex-direction:column;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--panel) 86%,transparent);text-decoration:none;font-weight:500}
.chip:hover{border-color:var(--accent-line)}
.chip small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
@media (max-width:900px){
  .entry-grid{grid-template-columns:minmax(0,1fr);gap:24px}
  .infobox{position:static;order:-1}
}

/* Liens */
.links{display:grid;gap:12px}
.link-card{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 86%,transparent);text-decoration:none;min-width:0;transition:border-color .15s}
.link-card:hover{border-color:var(--accent-line)}
.link-card>div{min-width:0}
.link-card strong{display:block;font-family:var(--f-head);font-weight:600;letter-spacing:.03em}
.link-card .note-l{display:block;margin-top:2px;font-family:var(--f-prose);font-size:1.08rem;color:var(--muted)}
.link-card .url{display:block;margin-top:2px;color:var(--faint);font-size:12px;overflow-wrap:anywhere}

/* Calendrier */
.cal-tools{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;margin-bottom:22px}
.cal-field{display:grid;gap:4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cal-field .in{width:auto;min-width:170px}
.cal-field #cal-y{width:110px;min-width:0}
.cal-bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px}
.cal-bar h2,.cal-bar h3{margin:0;text-align:center;font-family:var(--f-head);font-weight:600;letter-spacing:.05em;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.cal-bar h2{font-size:clamp(1rem,2.6vw,1.45rem)}
.cal-bar h3{font-size:clamp(1.1rem,3vw,1.7rem);color:var(--accent);text-shadow:0 0 20px color-mix(in srgb,var(--accent) 35%,transparent)}
.cal-bar.m{margin:20px 0 14px}
.cal-nav{padding:10px 16px;border:1px solid var(--accent-line);border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;white-space:nowrap}
.cal-nav:hover{background:color-mix(in srgb,var(--accent) 22%,var(--bg))}
.cal-nav.sq{padding:7px 14px;font-size:20px;line-height:1}
.cal-grid{display:grid;grid-template-columns:repeat(var(--cols,7),minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wd{padding:10px 4px;text-align:center;font-family:var(--f-head);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--panel-2);overflow:hidden;text-overflow:ellipsis}
.day{position:relative;display:flex;flex-direction:column;align-items:flex-start;min-width:0;min-height:112px;padding:10px 12px;background:color-mix(in srgb,var(--panel) 82%,var(--bg))}
.day.blank{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--panel) 70%,var(--bg)) 0 6px,var(--bg-side) 6px 12px)}
.dn{display:grid;place-items:center;min-width:26px;height:26px;border-radius:50%;font-size:15px;font-weight:500}
.day.today .dn{background:var(--accent);color:var(--bg);font-weight:700}
.moons{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.mn{display:block;line-height:0}
.moon{display:block}
.ev{display:block;max-width:100%;margin-top:auto;padding:2px 7px;border:1px solid var(--accent-line);border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .dn+.moons+.ev{margin-top:10px}
.cal-legend{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:16px;color:var(--muted);font-size:13px}
.lg{display:inline-flex;align-items:center;gap:8px}
.lg .dot{display:block;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.cal-events{margin-top:26px}
.cal-events h4{margin:0 0 12px;font-family:var(--f-head);font-weight:600;font-size:1rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cal-events ul{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.cal-events li{display:flex;gap:14px;align-items:baseline;font-family:var(--f-prose);font-size:1.2rem}
.cal-events b{min-width:2.2em;font-family:var(--f-head);font-size:.95rem;color:var(--accent)}
.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:20px}
.mini{display:grid;gap:10px;align-content:start;min-width:0;padding:14px;text-align:left;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 86%,transparent);transition:border-color .15s}
.mini:hover,.mini.cur{border-color:var(--accent-line)}
.mini-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-head);font-weight:600;letter-spacing:.04em}
.mini-t small{font-family:var(--f-ui);font-size:11px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.mini-grid{display:grid;grid-template-columns:repeat(var(--cols,7),minmax(0,1fr));gap:2px;text-align:center;font-size:11.5px;color:var(--muted)}
.mh{color:var(--accent);font-weight:600}
.md{padding:3px 0;border-radius:50%}
.md.today{background:var(--accent);color:var(--bg);font-weight:700}
@media (max-width:640px){
  .cal-bar{gap:8px}
  .cal-nav{padding:9px 11px;font-size:13px}
  .wd{padding:8px 0;font-size:10px;letter-spacing:.02em}
  .day{min-height:68px;padding:5px 3px;align-items:center}
  .dn{min-width:22px;height:22px;font-size:13px}
  .moons{position:static;margin-top:4px;gap:2px}
  .moon{width:10px;height:10px}
  .ev{width:6px;height:6px;margin-top:4px!important;padding:0;border-radius:50%;font-size:0;background:var(--accent)}
  .day .dn+.moons+.ev{margin-top:4px}
}

/* Recherche */
.in{width:100%;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit}
.in:focus{outline:none;border-color:var(--accent)}

/* Plans de l'existence */
.planes{margin:8px 0 40px}
.planes-fig svg{display:block;width:100%;height:auto;max-width:700px;margin:0 auto}
.plane-hint{margin:14px 0 0;min-height:1.6em;text-align:center;color:var(--muted);font-size:14px}
.plane-hint strong{color:var(--text);font-family:var(--f-head);letter-spacing:.04em}
.pl{cursor:pointer;outline:none}
.pl .shape{fill:var(--c);fill-opacity:.2;stroke:var(--c);stroke-width:1.5;transition:fill-opacity .15s}
.pl:hover .shape{fill-opacity:.4}
.pl.sel .shape{fill-opacity:.5;stroke:#fff;stroke-width:2.5}
.pl:focus-visible .shape{stroke:var(--accent);stroke-width:4}
.pl .lbl{fill:#f1f5fc;font-family:var(--f-head);font-size:24px;font-weight:600;letter-spacing:.04em;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pl .lbl.up{font-size:21px;letter-spacing:.22em;text-transform:uppercase}
.stars circle{fill:#dfe8ff}
.plane-map{padding:12px 14px 6px;border-bottom:1px solid var(--line)}
.plane-map svg{display:block;width:100%;height:auto}
.plane-map .pl .lbl{font-size:28px}
.plane-map .pl .lbl.up{font-size:26px;letter-spacing:.1em}
.plane-main{min-width:0}
.grp{margin:0 0 14px;font-family:var(--f-head);font-weight:600;font-size:1rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.grp small{margin-left:6px;font-family:var(--f-ui);font-size:12px;letter-spacing:0;color:var(--faint)}
.grp.idx{margin-top:40px}
.grp-block{margin-bottom:28px}

  var base=seed();
  try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);if(d&&d.settings&&d.settings.collapsed)base.settings.collapsed=true;}}catch(e){}
  return base;
}

function actOf(k){return k==='entry'?'open-entry':k==='plane'?'plane':'open-chron';}
function byTitle(t){
  t=String(t).toLowerCase();
  var e=S.wiki.find(function(x){return x.title.toLowerCase()===t;});
  if(e)return {kind:'entry',id:e.id,title:e.title,cat:e.cat};
  e=S.chronicles.find(function(x){return x.title.toLowerCase()===t;});
  if(e)return {kind:'chronicle',id:e.id,title:e.title,cat:'Chronique'};
  var pl=planeList().filter(function(p){return p.name.toLowerCase()===t;})[0];
  if(pl)return {kind:'plane',id:pl.id,title:pl.name,cat:pl.tag};
  return null;
}

    if(i%2){
      var raw=p.slice(2,-2),parts=raw.split('|'),t=parts[0].trim(),label=(parts[1]||parts[0]).trim(),r=byTitle(t);
      return r?'<a class="xref" href="#" data-act="'+actOf(r.kind)+'" data-id="'+r.id+'">'+esc(label)+'</a>'
              :'<span class="xref missing" title="Cette entrée n’existe pas encore">'+esc(label)+'</span>';
    }
    return esc(p).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
  }).join('');
}
function prose(text){
  return String(text||'').trim().split(/\n{2,}/).map(function(b){
    b=b.trim();if(!b)return '';
    if(b.indexOf('## ')===0)return '<h3>'+inline(b.slice(3))+'</h3>';
    var lines=b.split('\n');
    if(lines.every(function(l){return l.indexOf('- ')===0;}))return '<ul>'+lines.map(function(l){return '<li>'+inline(l.slice(2))+'</li>';}).join('')+'</ul>';
    return '<p>'+inline(b).replace(/\n/g,'<br>')+'</p>';
  }).join('');
}
function refsIn(text){
  var out=[];
  (String(text||'').match(/\[\[([^\]]+)\]\]/g)||[]).forEach(function(m){
    var r=byTitle(m.slice(2,-2).split('|')[0].trim());
    if(r&&!out.some(function(o){return o.id===r.id;}))out.push(r);
  });
  return out;
}
function backlinks(title,selfId){
  var rx=new RegExp('\\[\\['+title.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(\\||\\]\\])','i'),out=[];
  S.wiki.forEach(function(e){
    if(e.id===selfId)return;
    var hay=e.summary+'\n'+e.body+'\n'+e.fields.map(function(f){return f[1];}).join('\n');
    if(rx.test(hay))out.push({kind:'entry',id:e.id,title:e.title,cat:e.cat});
  });
  S.chronicles.forEach(function(c){
    if(c.id===selfId)return;
    if(rx.test(c.summary+'\n'+c.body))out.push({kind:'chronicle',id:c.id,title:c.title,cat:'Chronique'});
  });
  return out;
}
function chip(r){return '<a class="chip" href="#" data-act="'+actOf(r.kind)+'" data-id="'+r.id+'"><small>'+esc(r.cat)+'</small>'+esc(r.title)+'</a>';}

var PLANE_HINT='Survolez un plan pour le nommer, cliquez pour ouvrir sa page.';
function planeList(){
  var n=ELEMENTS.length;
  var el=ELEMENTS.map(function(e,i){
    return {id:e.id,name:e.name,tag:'Plan élémentaire',color:e.color,text:e.text,
      facts:[['Borde','Le plan matériel et le plan astral'],['Voisins',ELEMENTS[(i+n-1)%n].short+' et '+ELEMENTS[(i+1)%n].short],['Opposé',ELEMENTS[(i+Math.floor(n/2))%n].short]]};
  });
  function by(id){return PLANES.filter(function(p){return p.id===id;})[0];}
  return [by('upper'),by('astral')].concat(el,[by('material'),by('lower')]);
}
function planeById(id){return planeList().filter(function(p){return p.id===id;})[0];}
function planeNeighbors(id){
  var els=ELEMENTS.map(function(e){return e.id;}),n=els.length,i=els.indexOf(id);
  if(id==='upper'||id==='lower')return ['astral'];
  if(id==='astral')return ['upper','lower'].concat(els);
  if(id==='material')return els;
  return ['material','astral',els[(i+n-1)%n],els[(i+1)%n]];
}
function pol(r,deg){var a=deg*Math.PI/180;return [400+r*Math.cos(a),430+r*Math.sin(a)];}
function pf(pt){return pt[0].toFixed(1)+' '+pt[1].toFixed(1);}
function sector(r1,r2,a0,a1){
  return 'M'+pf(pol(r2,a0))+'A'+r2+' '+r2+' 0 0 1 '+pf(pol(r2,a1))+'L'+pf(pol(r1,a1))+'A'+r1+' '+r1+' 0 0 0 '+pf(pol(r1,a0))+'Z';
}
function planeSvg(sel){
  var n=ELEMENTS.length,step=360/n,o='',i;
  function g(id,inner){
    var p=planeById(id);
    return '<g class="pl'+(sel===id?' sel':'')+'" style="--c:'+p.color+'" data-act="plane" data-id="'+id+'" tabindex="0" role="link" aria-label="'+esc(p.name)+'"><title>'+esc(p.name)+'</title>'+inner+'</g>';
  }
  var rs=7,st='';
  function nx(){rs=(rs*9301+49297)%233280;return rs/233280;}
  for(i=0;i<46;i++){var a=nx()*360,r=240+nx()*54,pt=pol(r,a);st+='<circle cx="'+pt[0].toFixed(1)+'" cy="'+pt[1].toFixed(1)+'" r="'+(0.8+nx()*1.2).toFixed(1)+'" opacity="'+(0.35+nx()*0.5).toFixed(2)+'"/>';}
  o+=g('astral','<circle class="shape" cx="400" cy="430" r="300"/><g class="stars">'+st+'</g><text class="lbl up" x="400" y="165">'+esc(planeById('astral').name)+'</text>');
  ELEMENTS.forEach(function(e,k){
    var c=-90+k*step,lp=pol(168,c);
    o+=g(e.id,'<path class="shape" d="'+sector(104,232,c-step/2+1.6,c+step/2-1.6)+'"/><text class="lbl" x="'+lp[0].toFixed(1)+'" y="'+lp[1].toFixed(1)+'">'+esc(e.short)+'</text>');
  });
  var mw=planeById('material').name.split(' ');
  o+=g('material','<circle class="shape" cx="400" cy="430" r="88"/><text class="lbl" x="400" y="418">'+esc(mw[0])+'</text><text class="lbl" x="400" y="446">'+esc(mw.slice(1).join(' '))+'</text>');
  o+=g('upper','<rect class="shape" x="70" y="12" width="660" height="96" rx="48"/><text class="lbl" x="400" y="60">'+esc(planeById('upper').name)+'</text>');
  o+=g('lower','<rect class="shape" x="70" y="752" width="660" height="96" rx="48"/><text class="lbl" x="400" y="800">'+esc(planeById('lower').name)+'</text>');
  return '<svg viewBox="0 0 800 860" role="group" aria-label="Schéma des plans de l’existence, vue de face">'+o+'</svg>';
}

/* ---------- Calendrier ---------- */
var cs={y:CAL.today.y,m:CAL.today.m-1,v:'month'};
function calYearLen(){return CAL.months.reduce(function(a,m){return a+m.d;},0);}
function calBefore(mi){var n=0;for(var i=0;i<mi;i++)n+=CAL.months[i].d;return n;}
function calAbs(y,mi,d){return (y-1)*calYearLen()+calBefore(mi)+(d-1);}
function calWeekday(a){var n=CAL.weekdays.length;return ((CAL.epochWeekday+a)%n+n)%n;}
function calPhase(moon,a){var c=moon.cycle,ref=calAbs(moon.full.y,moon.full.m-1,moon.full.d),t=(((a-ref)%c)+c)%c;return (t/c+0.5)%1;}
var PH=['Nouvelle lune','Premier croissant','Premier quartier','Gibbeuse croissante','Pleine lune','Gibbeuse décroissante','Dernier quartier','Dernier croissant'];
function calPhaseName(p){return PH[Math.floor(p*8+0.5)%8];}
function moonSvg(p,size,color){
  var r=size/2-0.75,c=size/2,k=Math.cos(2*Math.PI*p),rx=Math.abs(k)*r,d;
  if(p<0.5)d='M'+c+' '+(c-r)+'A'+r+' '+r+' 0 0 1 '+c+' '+(c+r)+'A'+rx+' '+r+' 0 0 '+(k>0?0:1)+' '+c+' '+(c-r)+'Z';
  else d='M'+c+' '+(c-r)+'A'+r+' '+r+' 0 0 0 '+c+' '+(c+r)+'A'+rx+' '+r+' 0 0 '+(k>0?1:0)+' '+c+' '+(c-r)+'Z';
  return '<svg class="moon" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" aria-hidden="true"><circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="#0a1020" stroke="#5f7298" stroke-width="1"/><path d="'+d+'" fill="'+color+'"/></svg>';
}
function calEvents(y,m,d){return CAL.events.filter(function(e){return e.m===m&&e.d===d&&(e.y==null||e.y===y);});}
function calLegend(){
  return '<div class="cal-legend">'+CAL.moons.map(function(m){return '<span class="lg">'+moonSvg(0.5,14,m.color)+esc(m.n)+', cycle de '+m.cycle+' jours</span>';}).join('')+'<span class="lg"><i class="dot"></i>Date actuelle du récit</span></div>';
}
function calMonthHtml(){
  var mo=CAL.months[cs.m],n=CAL.weekdays.length,first=calWeekday(calAbs(cs.y,cs.m,1)),cells='',list=[];
  var isCur=CAL.today.y===cs.y&&CAL.today.m-1===cs.m;
  for(var i=0;i<first;i++)cells+='<div class="day blank"></div>';
  for(var d=1;d<=mo.d;d++){
    var a=calAbs(cs.y,cs.m,d);
    var moons=CAL.moons.map(function(m){var p=calPhase(m,a);return '<span class="mn" title="'+esc(m.n+' : '+calPhaseName(p))+'">'+moonSvg(p,14,m.color)+'</span>';}).join('');
    var evs=calEvents(cs.y,cs.m+1,d);
    evs.forEach(function(e){list.push({d:d,title:e.title});});
    cells+='<div class="day'+(isCur&&CAL.today.d===d?' today':'')+'"><span class="dn">'+d+'</span><span class="moons">'+moons+'</span>'+evs.map(function(e){return '<span class="ev" title="'+esc(e.title)+'">'+esc(e.title)+'</span>';}).join('')+'</div>';
  }
  var rest=(n-(first+mo.d)%n)%n;
  for(var j=0;j<rest;j++)cells+='<div class="day blank"></div>';
  return '<div class="cal-bar m"><button class="cal-nav sq" data-act="cal-month" data-step="-1" aria-label="Mois précédent">‹</button><h3>'+esc(mo.n)+' — Mois '+(cs.m+1)+'</h3><button class="cal-nav sq" data-act="cal-month" data-step="1" aria-label="Mois suivant">›</button></div>'
   +'<div class="cal-grid" style="--cols:'+n+'">'+CAL.weekdays.map(function(w){return '<div class="wd">'+esc(w)+'</div>';}).join('')+cells+'</div>'
   +calLegend()
   +(list.length?'<section class="cal-events"><h4>Événements du mois</h4><ul>'+list.map(function(e){return '<li><b>'+e.d+'</b><span>'+esc(e.title)+'</span></li>';}).join('')+'</ul></section>':'');
}
function calYearHtml(){
  var n=CAL.weekdays.length,head=CAL.weekdays.map(function(w){return '<span class="mh">'+esc(w.charAt(0))+'</span>';}).join('');
  return '<div class="year-grid">'+CAL.months.map(function(mo,mi){
    var first=calWeekday(calAbs(cs.y,mi,1)),cells='',cur=CAL.today.y===cs.y&&CAL.today.m-1===mi;
    for(var i=0;i<first;i++)cells+='<span class="md"></span>';
    for(var d=1;d<=mo.d;d++)cells+='<span class="md'+(cur&&CAL.today.d===d?' today':'')+'">'+d+'</span>';
    return '<button class="mini'+(cur?' cur':'')+'" data-act="cal-open" data-m="'+mi+'" aria-label="Ouvrir '+esc(mo.n)+'"><span class="mini-t">'+esc(mo.n)+'<small>Mois '+(mi+1)+'</small></span><span class="mini-grid" style="--cols:'+n+'">'+head+cells+'</span></button>';
  }).join('')+'</div>'+calLegend();
}
function vCalendar(){
  var opts=CAL.months.map(function(m,i){return '<option value="'+i+'">'+(i+1)+'. '+esc(m.n)+'</option>';}).join('');
  return '<header class="ph"><div><p class="eyebrow">Chronologie</p><h1>Calendrier</h1><p class="lede">Jours, mois et phases des lunes dans le monde.</p></div></header>'
   +'<div class="cal-tools"><div class="chips" role="group" aria-label="Affichage"><button class="pill" data-act="cal-view" data-v="month">Mois</button><button class="pill" data-act="cal-view" data-v="year">Année</button></div>'
   +'<label class="cal-field" id="cal-mw"><span>Mois</span><select id="cal-m" class="in">'+opts+'</select></label>'
   +'<label class="cal-field"><span>Année</span><input id="cal-y" class="in" type="number" min="1" step="1"></label>'
   +'<button class="btn" data-act="cal-today">Aller à aujourd’hui</button></div>'
   +'<div id="cal-body"></div>';
}
function drawCal(){
  var host=$('#cal-body');if(!host)return;
  $('#cal-y').value=cs.y;$('#cal-m').value=cs.m;
  $('#cal-mw').hidden=cs.v!=='month';
  Array.prototype.forEach.call(document.querySelectorAll('[data-act="cal-view"]'),function(b){b.setAttribute('aria-pressed',String(b.dataset.v===cs.v));});
  var ae=document.activeElement,sel=null;
  if(ae&&host.contains(ae)&&ae.dataset&&ae.dataset.act)sel='[data-act="'+ae.dataset.act+'"]'+(ae.dataset.step?'[data-step="'+ae.dataset.step+'"]':'');
  host.innerHTML='<div class="cal-bar"><button class="cal-nav" data-act="cal-year" data-step="-1">‹ Année</button><h2>Année '+cs.y+' — '+esc(CAL.era)+'</h2><button class="cal-nav" data-act="cal-year" data-step="1">Année ›</button></div>'+(cs.v==='month'?calMonthHtml():calYearHtml());
  if(sel){var nf=host.querySelector(sel);if(nf)nf.focus();}
}

function render(){
  renderNav();
  var fn={sanctum:vSanctum,chronicles:vChronicles,chronicle:vChronicle,wiki:vWiki,entry:vEntry,category:vCategory,plane:vPlane,links:vLinks,calendar:vCalendar}[V.name]||vSanctum;
  $('#view').innerHTML=fn();
  if(V.name==='calendar')drawCal();
}

/* ---------- Réglages ---------- */
function applySettings(){
  document.documentElement.style.setProperty('--accent',S.settings.accent);
  document.documentElement.classList.toggle('still',!S.settings.anim);
  $('#sky').hidden=!S.settings.sky;
  $('#app').classList.toggle('collapsed',!!S.settings.collapsed);
  refreshBrand();
}
/* ---------- Événements ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  e.preventDefault();
  var a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case 'nav':go(t.dataset.view);break;
    case 'open-entry':go('entry',id);break;
    case 'open-chron':go('chronicle',id);break;
    case 'back':back();break;
    case 'collapse':S.settings.collapsed=!S.settings.collapsed;save();$('#app').classList.toggle('collapsed',S.settings.collapsed);break;
    case 'menu':$('#app').classList.add('open');break;
    case 'menu-close':closeDrawer();break;
    case 'scroll-next':{var r=$('#recent');if(r)r.scrollIntoView({behavior:RM?'auto':'smooth'});break;}
    case 'theme':go('category',t.dataset.cat);break;
    case 'plane':go('plane',t.dataset.id);break;
    case 'cal-view':cs.v=t.dataset.v;drawCal();break;
    case 'cal-year':cs.y=Math.max(1,cs.y+parseInt(t.dataset.step,10));drawCal();break;
    case 'cal-month':{
      var stp=parseInt(t.dataset.step,10),cnt=CAL.months.length,nm=cs.m+stp,ny=cs.y;
      if(nm<0){if(ny>1){nm=cnt-1;ny--;}else nm=0;}else if(nm>=cnt){nm=0;ny++;}
      cs.m=nm;cs.y=ny;drawCal();break;}
    case 'cal-open':cs.m=parseInt(t.dataset.m,10);cs.v='month';drawCal();break;
    case 'cal-today':cs.y=CAL.today.y;cs.m=CAL.today.m-1;cs.v='month';drawCal();break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){q=t.value;$('#results').innerHTML=wikiResults();}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='cal-m'){cs.m=parseInt(t.value,10)||0;drawCal();}
  else if(t.id==='cal-y'){var v=parseInt(t.value,10);if(v>=1)cs.y=v;drawCal();}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeDrawer();
  else if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('data-act')==='plane'&&e.target.tagName.toLowerCase()==='g'){
    e.preventDefault();go('plane',e.target.getAttribute('data-id'));
  }
});

/* ---------- Ciel étoilé ---------- */
var sky=$('#sky'),cx=sky.getContext('2d');
var W=0,H=0,stars=[],links=[],shooters=[],raf=0,nextShot=0,lastT=0;
function buildSky(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  sky.width=Math.round(W*dpr);sky.height=Math.round(H*dpr);
  cx.setTransform(dpr,0,0,dpr,0,0);
  var n=Math.round(W*H/7500*S.settings.density);
  stars=[];
  for(var i=0;i<n;i++){
    var big=Math.random()<0.06;
    stars.push({x:Math.random()*W,y:Math.random()*H,r:big?1.5+Math.random()*0.8:0.35+Math.random()*0.75,a:0.3+Math.random()*0.6,ph:Math.random()*6.283,sp:0.5+Math.random()*1.5,big:big});
  }
  var key=[];
  stars.forEach(function(s,i){if(s.big||s.r>0.95)key.push({s:s,i:i});});
  var seen={};links=[];
  key.forEach(function(a){
    key.filter(function(b){return b.i!==a.i;}).map(function(b){return {b:b,d:Math.hypot(a.s.x-b.s.x,a.s.y-b.s.y)};})
      .filter(function(o){return o.d<240;}).sort(function(u,v){return u.d-v.d;}).slice(0,2)
      .forEach(function(o){var k=a.i<o.b.i?a.i+'-'+o.b.i:o.b.i+'-'+a.i;if(!seen[k]){seen[k]=1;links.push([a.s,o.b.s]);}});
  });
  draw(performance.now(),0);
}
function spawnShot(){
  var ang=(28+Math.random()*14)*Math.PI/180,sp=650+Math.random()*350;
  shooters.push({x:Math.random()*W*0.8,y:Math.random()*H*0.45,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,age:0,life:0.8+Math.random()*0.6,len:110+Math.random()*90});
}
function draw(t,dt){
  cx.clearRect(0,0,W,H);
  var g=cx.createRadialGradient(W*0.55,H*0.32,0,W*0.55,H*0.32,Math.max(W,H)*0.65);
  g.addColorStop(0,'rgba(72,52,130,.17)');g.addColorStop(0.5,'rgba(24,40,90,.07)');g.addColorStop(1,'rgba(5,8,19,0)');
  cx.globalAlpha=1;cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.strokeStyle='rgba(140,190,240,.08)';cx.lineWidth=1;cx.beginPath();
  links.forEach(function(l){cx.moveTo(l[0].x,l[0].y);cx.lineTo(l[1].x,l[1].y);});
  cx.stroke();
  var anim=S.settings.anim;
  for(var i=0;i<stars.length;i++){
    var s=stars[i],tw=anim?0.62+0.38*Math.sin(t/1000*s.sp+s.ph):1;
    cx.globalAlpha=Math.min(1,s.a*tw);
    cx.fillStyle=s.big?'#ffffff':'#d9e6ff';
    cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.2832);cx.fill();
  }
  cx.globalAlpha=1;
  for(var j=0;j<stars.length;j++){
    var b=stars[j];if(!b.big)continue;
    var h=cx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*5);
    h.addColorStop(0,'rgba(190,220,255,.26)');h.addColorStop(1,'rgba(190,220,255,0)');
    cx.fillStyle=h;cx.fillRect(b.x-b.r*5,b.y-b.r*5,b.r*10,b.r*10);
  }
  for(var k=shooters.length-1;k>=0;k--){
    var o=shooters[k];o.age+=dt;
    if(o.age>o.life){shooters.splice(k,1);continue;}
    var hx=o.x+o.vx*o.age,hy=o.y+o.vy*o.age,sp=Math.hypot(o.vx,o.vy),tx=hx-o.vx/sp*o.len,ty=hy-o.vy/sp*o.len;
    var lg=cx.createLinearGradient(tx,ty,hx,hy);
    lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(1,'rgba(255,255,255,1)');
    cx.globalAlpha=Math.sin(Math.PI*o.age/o.life);
    cx.strokeStyle=lg;cx.lineWidth=1.5;cx.beginPath();cx.moveTo(tx,ty);cx.lineTo(hx,hy);cx.stroke();
  }
  cx.globalAlpha=1;
}
function loop(t){
  var dt=Math.min(0.05,(t-lastT)/1000||0);lastT=t;
  if(t>nextShot){spawnShot();nextShot=t+3500+Math.random()*5500;}
  draw(t,dt);
  raf=requestAnimationFrame(loop);
}
function startSky(){
  cancelAnimationFrame(raf);raf=0;shooters=[];
  if(!S.settings.sky)return;
  if(S.settings.anim&&!document.hidden){lastT=performance.now();nextShot=lastT+1500;raf=requestAnimationFrame(loop);}
  else draw(performance.now(),0);
}
document.addEventListener('visibilitychange',startSky);
var rt=0;
window.addEventListener('resize',function(){
  clearTimeout(rt);
  rt=setTimeout(function(){
    if(Math.abs(window.innerWidth-W)>40||window.innerHeight-H>150){buildSky();startSky();}
  },200);
});

applySettings();
render();
buildSky();
startSky();
})();
</script>

</html>
